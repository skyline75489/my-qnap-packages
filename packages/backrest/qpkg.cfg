# QPKG metadata for Backrest — native binary package for QTS (no Container Station).
#
# Constraints from the QDK spec: QPKG_NAME <= 20 chars, QPKG_VER <= 10 chars,
# neither may contain whitespace.

QPKG_NAME="Backrest"
QPKG_DISPLAY_NAME="backrest"
QPKG_VER="1.14.1"
QPKG_AUTHOR="skyline"
QPKG_LICENSE="GPL-3.0"
QPKG_SUMMARY="Web UI and orchestrator for restic backup (native binary, no Container Station)"

# Start/stop ordering and the App Center start/stop script.
QPKG_RC_NUM="201"
QPKG_SERVICE_PROGRAM="backrest.sh"
QPKG_SERVICE_PORT="9898"

# config.json holds the repo definitions AND the restic repository passwords,
# so it must survive an upgrade. QPKG_CONFIG gives it the .qdkorig/.qdksave
# lifecycle: a locally modified config is kept, a pristine one is replaced.
QPKG_CONFIG="config.json"

# Backrest starts in about a second; leave headroom but do not stall boot.
QPKG_TIMEOUT="60,30"

# Web UI: backrest serves its own embedded SPA at "/" and its Connect RPC API
# on the same port. 9898 is backrest's upstream default and collides with
# nothing QTS itself uses (5000 is the QTS portal, hence not 5000 here).
QPKG_WEBUI="/"
QPKG_WEB_PORT="9898"

QTS_MINI_VERSION="5.0.0"

# 3 = let the admin choose the volume at install AND at migration.
# The sqlite databases, the config and the logs live under $SYS_QPKG_DIR/data,
# so the install volume is also the storage volume — it must land somewhere
# with room.
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
