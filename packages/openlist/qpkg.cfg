# QPKG metadata for OpenList — native binary package for QTS (no Container Station).
#
# Constraints from the QDK spec: QPKG_NAME <= 20 chars, QPKG_VER <= 10 chars,
# neither may contain whitespace.

QPKG_NAME="OpenList"
QPKG_DISPLAY_NAME="OpenList"
QPKG_VER="4.2.9"
QPKG_AUTHOR="skyline"
QPKG_LICENSE="AGPL-3.0"
QPKG_SUMMARY="File list program (native binary, no Container Station)"

# Start/stop ordering and the App Center start/stop script.
QPKG_RC_NUM="200"
QPKG_SERVICE_PROGRAM="openlist.sh"
QPKG_SERVICE_PORT="5244"

# OpenList starts in about a second; leave headroom but do not stall boot.
QPKG_TIMEOUT="60,30"

# Web UI: OpenList serves its own embedded SPA at "/" and its REST API on the
# same port. 5244 is OpenList's upstream default and collides with nothing
# QTS itself uses (5000 is the QTS portal, hence not 5000 here).
QPKG_WEBUI="/"
QPKG_WEB_PORT="5244"

QTS_MINI_VERSION="5.0.0"

# 3 = let the admin choose the volume at install AND at migration.
# The sqlite database, the config and the logs live under $SYS_QPKG_DIR/data,
# so the install volume is also the storage volume — it must land somewhere
# with room.
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
