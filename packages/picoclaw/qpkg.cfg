# QPKG metadata for PicoClaw — native binary package for QTS (no Container Station).
#
# Constraints from the QDK spec: QPKG_NAME <= 20 chars, QPKG_VER <= 10 chars,
# neither may contain whitespace.

QPKG_NAME="PicoClaw"
QPKG_DISPLAY_NAME="picoclaw"
QPKG_VER="0.3.1"
QPKG_AUTHOR="skyline"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="PicoClaw web console and AI agent (native static binaries, no Container Station)"

# Start/stop ordering and the App Center start/stop script.
QPKG_RC_NUM="202"
QPKG_SERVICE_PROGRAM="picoclaw.sh"
QPKG_SERVICE_PORT="18800"

# The launcher's own state lives in $QPKG_ROOT/home:
#
#   home/config.json     the model list, channel settings, gateway settings
#   home/.security.yml   API keys and channel tokens
#   home/launcher-auth.db  the dashboard password (SQLite)
#
# The first two are the user's configuration and credentials, so they are
# tracked by QPKG_CONFIG: the package ships a minimal seed of each, the
# launcher fills them in at first start, and a locally modified file is kept
# across an upgrade. The password database is created at runtime and is not
# tracked — a new password can be set from the UI at any time.
QPKG_CONFIG="home/config.json home/.security.yml"

# The launcher is a Go binary and binds its port in well under a second.
QPKG_TIMEOUT="60,30"

# Web UI: the launcher serves the web console at "/" and redirects to
# /launcher-login. 18800 is upstream's own default port and collides with
# nothing QTS uses (5000 is the QTS portal, hence not 5000 here).
QPKG_WEBUI="/"
QPKG_WEB_PORT="18800"

QTS_MINI_VERSION="5.0.0"

# 3 = let the admin choose the volume at install AND at migration. The
# config, the credentials and the workspace live under $SYS_QPKG_DIR/home, so
# the install volume is also the storage volume.
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
