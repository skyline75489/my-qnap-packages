# QPKG metadata for zot — native binary package for QTS (no Container Station).
#
# Constraints from the QDK spec: QPKG_NAME <= 20 chars, QPKG_VER <= 10 chars,
# neither may contain whitespace.

QPKG_NAME="Zot"
QPKG_DISPLAY_NAME="zot"
QPKG_VER="2.1.22"
QPKG_AUTHOR="skyline"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="OCI-native container registry (native binary, no Container Station)"

# Start/stop ordering and the App Center start/stop script.
QPKG_RC_NUM="199"
QPKG_SERVICE_PROGRAM="zot.sh"
QPKG_SERVICE_PORT="5050"

# config.json lives at $SYS_QPKG_DIR/config.json and needs upgrade-safe handling
# (.qdkorig/.qdksave) so a local edit is never silently clobbered.
QPKG_CONFIG="config.json"

# zot starts in well under a second; leave headroom but do not stall boot.
QPKG_TIMEOUT="60,30"

# Web UI: zot's own UI extension. 5000 is the QTS portal, hence 5050.
QPKG_WEBUI="/"
QPKG_WEB_PORT="5050"

QTS_MINI_VERSION="5.0.0"

# 3 = let the admin choose the volume at install AND at migration.
# The blob store lives under $SYS_QPKG_DIR/data, so the install volume is also
# the storage volume — it must land somewhere with room.
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
