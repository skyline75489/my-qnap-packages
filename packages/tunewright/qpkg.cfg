# QPKG metadata for Tunewright — native binary package for QTS (no Container Station).
#
# Constraints from the QDK spec: QPKG_NAME <= 20 chars, QPKG_VER <= 10 chars,
# neither may contain whitespace.

QPKG_NAME="Tunewright"
QPKG_DISPLAY_NAME="tunewright"
QPKG_VER="1.2.0"
QPKG_AUTHOR="skyline"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Batch-edit audio file metadata: tags, cover art, MusicBrainz lookup (native binary, no Container Station)"

# Start/stop ordering and the App Center start/stop script.
QPKG_RC_NUM="201"
QPKG_SERVICE_PROGRAM="tunewright.sh"
QPKG_SERVICE_PORT="8081"

# tunewright.conf holds the music library path and the port. It must survive an
# upgrade: QPKG_CONFIG gives it the .qdkorig/.qdksave lifecycle — a locally
# modified config is kept, a pristine one is replaced.
QPKG_CONFIG="tunewright.conf"

# The server starts in about a second and drains connections for up to 25s on
# SIGTERM, so the stop timeout has to cover that drain.
QPKG_TIMEOUT="60,40"

# Web UI: tunewright serves its own SvelteKit SPA at "/" and its REST API on
# the same port. 8081 is not used by QTS itself (5000 is the QTS portal, hence
# not 5000 here) and collides with nothing this NAS runs.
QPKG_WEBUI="/"
QPKG_WEB_PORT="8081"

QTS_MINI_VERSION="5.0.0"

# 3 = let the admin choose the volume at install AND at migration.
# The logs and the account database live under $SYS_QPKG_DIR/data, so the
# install volume is also the storage volume — it must land somewhere with room.
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
