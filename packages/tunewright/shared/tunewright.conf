# Tunewright configuration.
#
# Edit this file, then restart the package from the QTS App Center (or
# /etc/init.d/Tunewright.sh restart).
#
# QPKG_CONFIG gives this file upgrade-safe handling: as long as you edit it,
# your version is kept across package upgrades; if you leave it untouched, the
# pristine one from the new package replaces it.

# ---------------------------------------------------------------------------
# MUSIC_DIR — the music library Tunewright reads and writes.
#
# This is the directory the app lists and re-tags. It must be writable by the
# account the service runs as (root, see packages/tunewright/README.md), and
# it must exist before the first start.
#
# The app also writes its account database (users.json) into the library
# directory by default, which is ugly: put STATE_DIR somewhere else, or leave
# it empty and the packaged default ($QPKG_ROOT/data/state) is used.
# ---------------------------------------------------------------------------
MUSIC_DIR="/share/Multimedia/Music"

# STATE_DIR — where users.json / mcp_auth.json live.
#
# Empty = $QPKG_ROOT/data/state, which survives package upgrades but is
# removed when the package is uninstalled. Point it at a path on a shared
# volume (e.g. "/share/Multimedia/.tunewright") if you want the accounts to
# survive an uninstall as well.
STATE_DIR=""

# ---------------------------------------------------------------------------
# PORT — the TCP port the web UI and the REST API listen on.
#
# Keep it in step with QPKG_WEB_PORT in qpkg.cfg, which is what the App
# Center's "Web UI" link uses. 8081 is the default.
# ---------------------------------------------------------------------------
PORT="8081"

# ---------------------------------------------------------------------------
# HOST — the bind address.
#
# "0.0.0.0" makes the app reachable from the LAN. Leave it as it is unless
# you really want the app to be reachable, because:
#
#   * Until the first admin account exists, /api/v1/auth/setup hands the
#     account to the first caller. Tunewright refuses to start that race
#     when it binds a non-loopback address without a setup token — it
#     generates one and prints it to the package log instead.
#   * Setting SETUP_TOKEN below pins that token to a value you choose.
# ---------------------------------------------------------------------------
HOST="0.0.0.0"

# ---------------------------------------------------------------------------
# SETUP_TOKEN — the token required to claim the first admin account.
#
# Empty = Tunewright generates a random one at startup and writes it to the
# package log. Set it to a secret of your own to make it predictable.
# ---------------------------------------------------------------------------
SETUP_TOKEN=""

# ---------------------------------------------------------------------------
# COOKIE_SECURE — set to "true" when the app is served over HTTPS (through a
# reverse proxy), so the session cookie gets the Secure flag. Leave it "false"
# for plain HTTP on the LAN.
# ---------------------------------------------------------------------------
COOKIE_SECURE="false"

# ---------------------------------------------------------------------------
# TRUST_PROXY — set to "true" only behind a reverse proxy that sets
# X-Forwarded-For, so the login throttling sees the real client address
# instead of the proxy's. Leave it "false" otherwise: clients can spoof that
# header.
# ---------------------------------------------------------------------------
TRUST_PROXY="false"
